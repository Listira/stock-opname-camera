plugins {
    id 'com.android.application'
}

def ksPropsFile = rootProject.file('app/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) { ksProps.load(new FileInputStream(ksPropsFile)) }

android {
    namespace 'com.stockopname.snapname'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stockopname.snapname'
        minSdk 24
        targetSdk 34
        versionCode 34
        versionName '5.12'
        // Model scan QR bawa pustaka mesin buat banyak jenis prosesor sekaligus.
        // HP Android modern semuanya arm64 -> yang lain dibuang, APK jauh lebih kecil.
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPropsFile.exists()) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Kamera NATIVE (CameraX): zoom optik + pindah lensa otomatis kaya kamera bawaan/WA
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    // Scan QR / barcode aset — model IKUT DIBUNDEL di APK biar jalan penuh OFFLINE di kebun
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
}
